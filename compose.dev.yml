services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: phng
      POSTGRES_PASSWORD: phng
      POSTGRES_DB: phng
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phng -d phng"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
