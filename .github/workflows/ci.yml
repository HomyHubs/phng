name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  typecheck:
    name: Typecheck (api + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cai pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cai Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cai dependencies
        run: pnpm install --frozen-lockfile

      # Typecheck toan bo workspace; bao loi build se lam CI do -> chan auto-merge.
      - name: Typecheck
        run: pnpm -r run typecheck
